[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panda3d-minecraft"
version = "0.1.0"
description = "Mini Minecraft educativo desarrollado con Panda3D"
requires-python = ">=3.10,<3.11"
dependencies = [
    "panda3d"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
